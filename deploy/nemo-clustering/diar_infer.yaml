# VAD + speaker-embedding parameters vendored from NeMo's diar_infer_telephonic.yaml
# (nemo/examples/speaker_tasks/diarization/conf/inference/), not diar_infer_meeting.yaml.
# The meeting profile's 6-scale/3.0s-window embeddings need more speech per
# window than a short (<1min) recording provides: on tests/samples/katiesteve.wav
# (real 2-speaker clip) it degenerated to 17 "speakers" from 18 VAD segments.
# The general profile's shorter 3-scale embeddings fixed the speaker count but
# its coarser VAD (0.08s shift vs meeting's 0.01s) silently dropped a ~12s
# stretch of real speech from the RTTM. Telephonic's finer VAD (0.01s shift,
# median smoothing) plus 5-scale/1.5s-max embeddings reproduced the correct
# 2-speaker, full-coverage result and is NeMo's own profile for "telephone
# recordings involving 2~8 speakers" -- close enough to this platform's needs
# that it was cheaper to reuse than hand-tune from meeting. clustering.max_num_speakers
# and .sparse_search_volume are raised above the telephonic profile's default
# max_num_speakers (8) to keep the wider speaker-count search this model
# exists for: meetings with more speakers than the Sortformer NIMs are tuned
# for.
#
# 2026-07-11: validated against tests/samples/youtube_ar_32min_8spk.wav (real
# 32min/8spk Arabic recording). Baseline (5-scale/1.5s-max embeddings, as
# above) under-detected at 4 of 8 speakers with good segment coverage per
# detected speaker (not one dominant blob) -- consistent with embeddings not
# discriminative enough between similar-sounding speakers, not a VAD/coverage
# problem, so the VAD block above is left untouched. Added the meeting
# profile's 3.0s top scale (keeping telephonic's finer 5 scales beneath it
# rather than replacing them) for more discriminative embeddings on a file
# long enough to afford wider windows; short-clip callers keep the same
# 1.5s-and-under scales that were validated above. Revisit if this
# regresses the katiesteve.wav short-clip case.
#
# manifest_filepath / out_dir are left as `???`: server.py sets out_dir per
# request and passes audio paths straight to `diarize(paths2audio_files=...)`,
# which builds its own manifest.
name: &name "ClusterDiarizer"

num_workers: 1
sample_rate: 16000
batch_size: 64
device: cuda
verbose: True

diarizer:
  manifest_filepath: ???
  out_dir: ???
  oracle_vad: False # use the VAD model below, not ground-truth RTTM
  collar: 0.25
  ignore_overlap: True

  vad:
    model_path: vad_multilingual_marblenet
    external_vad_manifest: null
    parameters:
      window_length_in_sec: 0.15
      shift_length_in_sec: 0.01
      smoothing: "median"
      overlap: 0.5
      onset: 0.1
      offset: 0.1
      pad_onset: 0.1
      pad_offset: 0
      min_duration_on: 0
      min_duration_off: 0.2
      filter_speech_first: True

  speaker_embeddings:
    model_path: titanet_large
    parameters:
      window_length_in_sec: [3.0, 1.5, 1.25, 1.0, 0.75, 0.5]
      shift_length_in_sec: [1.5, 0.75, 0.625, 0.5, 0.375, 0.25]
      multiscale_weights: [1, 1, 1, 1, 1, 1]
      save_embeddings: False # stateless container; nothing else reads these

  clustering:
    parameters:
      oracle_num_speakers: False # fully unsupervised -- no speaker-count hint
      max_num_speakers: 20 # meetings up to ~15-20 speakers (overridable via NEMO_CLUSTERING_MAX_SPEAKERS)
      enhanced_count_thres: 80
      max_rp_threshold: 0.25
      sparse_search_volume: 30 # kept above the general profile's 10: finer p-value search for the wider speaker-count range above
      maj_vote_spk_count: False
      chunk_cluster_count: 50
      embeddings_per_chunk: 10000
