# Parakeet 1.1B RNNT Multilingual — two dedicated NIM containers on DGX Spark.
#
# Model page:  https://build.nvidia.com/nvidia/parakeet-1_1b-rnnt-multilingual-asr
# Deploy tab:  https://build.nvidia.com/nvidia/parakeet-1_1b-rnnt-multilingual-asr/deploy
#
# Services:
#   parakeet-nim-str  — streaming (mode=str by default); gRPC :50051, HTTP :9000
#   parakeet-nim-ofl  — offline batch (mode=ofl);         gRPC :50052, HTTP :9001
#
# Each service has its own cache volume so profile engines do not collide.
# Prereqs: cp deploy/parakeet-nim.env.example deploy/parakeet-nim.env → NGC key
#          ./scripts/parakeet_nim_up.sh

x-parakeet-nim-common: &parakeet-nim-common
  image: nvcr.io/nim/nvidia/parakeet-1-1b-rnnt-multilingual:latest
  restart: unless-stopped
  gpus: all
  ipc: host
  shm_size: "8gb"
  ulimits:
    memlock: -1
    stack: 67108864
    nofile:
      soft: 65536
      hard: 65536
  env_file:
    - path: parakeet-nim.env
      required: false

services:
  parakeet-nim-str:
    <<: *parakeet-nim-common
    container_name: parakeet-nim-str
    ports:
      - "${PARAKEET_NIM_HTTP_PORT:-9000}:9000"
      - "${PARAKEET_NIM_GRPC_PORT:-50051}:50051"
    environment:
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
      - NIM_TAGS_SELECTOR=${PARAKEET_NIM_TAGS_SELECTOR:-diarizer=sortformer,mode=str,type=default,vad=silero}
    volumes:
      - parakeet-nim-str-cache:/opt/nim/.cache

  parakeet-nim-ofl:
    <<: *parakeet-nim-common
    container_name: parakeet-nim-ofl
    ports:
      - "${PARAKEET_NIM_OFL_HTTP_PORT:-9001}:9000"
      - "${PARAKEET_NIM_OFL_GRPC_PORT:-50052}:50051"
    environment:
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
      - NIM_TAGS_SELECTOR=${PARAKEET_NIM_OFL_TAGS_SELECTOR:-diarizer=sortformer,mode=ofl,type=default,vad=silero}
    volumes:
      - parakeet-nim-ofl-cache:/opt/nim/.cache

volumes:
  parakeet-nim-str-cache:
    name: parakeet-nim-str-cache
  parakeet-nim-ofl-cache:
    name: parakeet-nim-ofl-cache
