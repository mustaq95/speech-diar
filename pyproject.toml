[project]
name = "diarization-platform"
version = "0.1.0"
description = "Speaker diarization evaluation platform - API, worker, and pluggable diarization models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "azure-storage-blob>=12.19",
    "azure-cognitiveservices-speech>=1.40",
    "nvidia-riva-client>=2.14",
    "requests>=2.31",
    "httpx>=0.27",
    "rq>=1.16",
    "redis>=5.0",
    "python-dotenv>=1.0",
    # TryHamsa STT speaks a streaming WebSocket protocol, and it is the default
    # (online) transcription engine -- so this belongs in the base deps, not in
    # the heavy `models` extra. A worker must be able to transcribe without a
    # CUDA-only install.
    "websockets>=13.0",
]

# Heavy, GPU-oriented local diarization engines. NOT installed by default -
# these only make sense on a machine with CUDA (e.g. DGX Spark):
#   uv sync --extra models
[project.optional-dependencies]
models = [
    "torch>=2.3",
    "torchaudio",
    "torchcodec>=0.7.0",
    "pyannote.audio>=4.0",
    "sherpa-onnx>=1.13",
    # sherpa-onnx's linux_armv7l wheel declares no Requires-Dist at all (unlike
    # its other platform wheels, which require sherpa-onnx-core), and uv's
    # cross-platform lock resolution treats that wheel's metadata as canonical
    # for the whole version -- so sherpa-onnx-core silently never gets locked
    # for any platform unless pinned here directly.
    "sherpa-onnx-core>=1.13",
    "numpy>=1.26",
    # Word-level timings for the live-speech transcript, in both transcription
    # modes. The PyPI package NAMED "ctc-forced-aligner" is an unrelated
    # English-only ONNX aligner (github.com/deskpai/ctc_forced_aligner) that
    # squats the name -- the MMS forced aligner this platform needs only exists
    # on GitHub, hence the direct source pin.
    "ctc-forced-aligner @ git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git",
    # Required by the aligner above (>=5.4 is what its MMS model loading path
    # needs on this host). Verified alongside pyannote.audio 4.0.7, which keeps
    # importing cleanly with the huggingface-hub 1.x that this pulls in.
    "transformers>=5.4.0",
]

# Installed by default with `uv sync` (uv treats "dev" as a default group).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.23",
    "honcho>=2.0.0",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

# The `models` extra pins ctc-forced-aligner straight from GitHub, because the
# PyPI package of that name is an unrelated project squatting it. Hatchling
# refuses direct references (VCS/URL deps) unless this is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = [
    "live: hits a real external service (e.g. Azure); skipped unless RUN_LIVE_TESTS=1",
]

# Plain PyPI has no CUDA-enabled torch/torchaudio/torchcodec wheels for Linux
# aarch64 (e.g. DGX Spark). PyTorch's own index publishes them under cu130
# (CUDA 13.0) for this exact platform + Python 3.12, so redirect just these
# three packages there; everything else (pyannote.audio, etc.) keeps resolving
# from PyPI as normal. `explicit = true` keeps this index from being consulted
# for any package not listed in [tool.uv.sources].
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
