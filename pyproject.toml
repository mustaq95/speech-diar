[project]
name = "diarization-platform"
version = "0.1.0"
description = "Speaker diarization evaluation platform - API, worker, and pluggable diarization models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "azure-storage-blob>=12.19",
    "azure-cognitiveservices-speech>=1.40",
    "nvidia-riva-client>=2.14",
    "requests>=2.31",
    "httpx>=0.27",
    "rq>=1.16",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

# Heavy, GPU-oriented local diarization engines. NOT installed by default -
# these only make sense on a machine with CUDA (e.g. DGX Spark):
#   uv sync --extra models
[project.optional-dependencies]
models = [
    "torch>=2.3",
    "torchaudio",
    "torchcodec>=0.7.0",
    "pyannote.audio>=4.0",
    "sherpa-onnx>=1.13",
    "numpy>=1.26",
]

# Installed by default with `uv sync` (uv treats "dev" as a default group).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.23",
    "honcho>=2.0.0",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
markers = [
    "live: hits a real external service (e.g. Azure); skipped unless RUN_LIVE_TESTS=1",
]

# Plain PyPI has no CUDA-enabled torch/torchaudio/torchcodec wheels for Linux
# aarch64 (e.g. DGX Spark). PyTorch's own index publishes them under cu130
# (CUDA 13.0) for this exact platform + Python 3.12, so redirect just these
# three packages there; everything else (pyannote.audio, etc.) keeps resolving
# from PyPI as normal. `explicit = true` keeps this index from being consulted
# for any package not listed in [tool.uv.sources].
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
