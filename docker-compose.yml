# Local development environment: database, queue broker, and object storage.
# Usage (from repo root): docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diarization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"  # S3 API; remapped from 9000, which the parakeet-nim-str NIM container owns on this host
      - "9099:9001"  # web console only; 9001 is taken locally too (parakeet-nim-ofl HTTP)
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
