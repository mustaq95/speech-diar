# Local development environment: database, queue broker, and object storage.
# Usage (from repo root): docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diarization
      POSTGRES_USER: diarization
      POSTGRES_PASSWORD: diarization
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9099:9001"  # web console only; 9001 is taken locally, S3 API (9000) stays default
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
