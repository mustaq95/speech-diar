# Local development environment: database, queue broker, object storage, and the
# on-host ASR container.
# Usage (from repo root): docker compose up -d
#
# `include` rather than a copy of the service: the cohere-transcribe definition
# stays the single source of truth in its own deploy/ folder (its build context,
# vLLM flags and volumes are all relative to that directory, and `include`
# resolves them there). Editing it in one place still changes both entry points.
#
# It is here because "not configured" on the Transcript surface is almost always
# just this container being down, and it was the one piece of infrastructure the
# repo expected you to start by hand. It already declares `restart:
# unless-stopped`, so once up it stays up across reboots and crashes exactly like
# postgres and redis. An explicit `docker stop` still wins, by design.
#
# GPU HOSTS ONLY. The service declares `gpus: all`, so on a machine without one
# `docker compose up -d` will fail on this service. Bring up just the plain infra
# there with:
#     docker compose up -d postgres redis minio
include:
  - deploy/cohere-transcribe/docker-compose.cohere-transcribe.yml

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diarization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"  # S3 API; remapped from 9000, which the parakeet-nim-str NIM container owns on this host
      - "9099:9001"  # web console only; 9001 is taken locally too (parakeet-nim-ofl HTTP)
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
